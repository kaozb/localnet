pluginManagement {
    repositories {
        if (!System.getenv('CI')) {
            // 本地开发走国内镜像加速；CI（GitHub Actions 等）直连官方源，
            // 避免 aliyun 镜像偶发 502 导致 lintVitalAnalyzeRelease 解析依赖失败。
            maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
            maven { url 'https://maven.aliyun.com/repository/google' }
            maven { url 'https://maven.aliyun.com/repository/public' }
        }
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositories {
        if (!System.getenv('CI')) {
            maven { url 'https://maven.aliyun.com/repository/google' }
            maven { url 'https://maven.aliyun.com/repository/public' }
        }
        google()
        mavenCentral()
    }
}
rootProject.name = "TinyBlock"
include ':app'
