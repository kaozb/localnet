plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tinyblock.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.tinyblock.app"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            // 使用 debug 签名，方便直接安装
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// 零第三方依赖：仅使用 Android SDK，APK 体积极小
dependencies {
}
