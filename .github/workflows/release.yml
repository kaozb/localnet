name: Build & Release

# 推送到 main 分支即触发：自动打 tag → 构建 APK → 发布 Release（含提交日志）
on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TinyBlock
    steps:
      - name: 检出代码（含完整历史，用于计算 tag 与提交日志）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK 组件
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: 计算版本号并打 tag
        id: tag
        run: |
          set -e
          LAST=$(git describe --tags --match 'v*' --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST" ]; then
            NEW="v1.0.0"
          else
            MAJOR=$(echo "$LAST" | sed -E 's/^v([0-9]+)\.([0-9]+)\.([0-9]+).*/\1/')
            MINOR=$(echo "$LAST" | sed -E 's/^v([0-9]+)\.([0-9]+)\.([0-9]+).*/\2/')
            PATCH=$(echo "$LAST" | sed -E 's/^v([0-9]+)\.([0-9]+)\.([0-9]+).*/\3/')
            NEW="v${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$NEW" -m "Release $NEW"
          git push origin "$NEW"
          echo "TAG=$NEW" >> "$GITHUB_ENV"
          echo "LAST=$LAST" >> "$GITHUB_ENV"
          echo "上一个 tag: $LAST，新 tag: $NEW"

      - name: 生成本次提交日志
        run: |
          {
            echo "### 更新内容"
            echo
            if [ -n "$LAST" ]; then
              git log --pretty=format:'- %s (%h)' "${LAST}..HEAD"
            else
              git log --pretty=format:'- %s (%h)'
            fi
            echo
            echo
            if [ -n "$LAST" ]; then
              echo "**完整对比**：https://github.com/${GITHUB_REPOSITORY}/compare/${LAST}...${TAG}"
            fi
          } > NOTES.md
          cat NOTES.md

      - name: 构建 APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "TinyBlock-${TAG}.apk"

      - name: 发布到 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" \
            "TinyBlock-${TAG}.apk" \
            --title "TinyBlock ${TAG}" \
            --notes-file NOTES.md
